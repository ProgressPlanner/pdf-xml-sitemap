name: Playground Comment

on:
  # Only posts metadata; never checks out or executes pull request code.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Build preview links
        id: preview
        env:
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os

          repository = os.environ['PR_REPOSITORY']
          sha = os.environ['PR_SHA']
          blueprint = {
              'landingPage': '/wp-admin/upload.php?mode=list',
              'features': {'networking': True},
              'login': True,
              'plugins': ['wordpress-seo'],
              'steps': [{
                  'step': 'installPlugin',
                  'pluginData': {
                      'resource': 'git:directory',
                      'url': f'https://github.com/{repository}',
                      'ref': sha,
                      'refType': 'commit',
                  },
                  'options': {
                      'activate': True,
                      'targetFolderName': 'pdf-sitemap',
                  },
              }],
          }
          encoded = base64.b64encode(json.dumps(blueprint).encode()).decode()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'playground=https://playground.wordpress.net/#{encoded}\n')
              output.write(f'zip=https://github.com/{repository}/archive/{sha}.zip\n')
          PY

      - uses: mshick/add-pr-comment@c96a9caed2a8cc0ed55e1f105725e383d63569d0 # v2
        with:
          message: |
            **Test on Playground**
            [Test this pull request on the Playground](${{ steps.preview.outputs.playground }}) or [download the zip](${{ steps.preview.outputs.zip }}).
